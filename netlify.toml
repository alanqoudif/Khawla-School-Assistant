[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# متغيرات البيئة في netlify.toml لا تصل لـ API (Functions) عند التشغيل.
# يجب إضافة PINECONE_API_KEY و PINECONE_ASSISTANT_ID من:
# Netlify Dashboard → Site configuration → Environment variables
# مع تفعيل Scope: Builds and Functions (أو على الأقل Functions)
[build.environment]
  NODE_VERSION = "18"
